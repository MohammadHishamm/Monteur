services:
  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  db:
    image: postgres:16.3
    container_name: fproject-postgres-db-v2
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db-data-v2:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Redis Database
  # -----------------------------
  redis:
    image: redis:7.2
    container_name: fproject-redis-db-v2
    command: redis-server --save 60 1 --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data-v2:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "${REDIS_PASSWORD}" ping']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  db-data-v2:
  redis-data-v2:
